name: nnf
description: "no-nonsense-finance — self-hosted budgeting"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # state
  flutter_riverpod: ^2.6.1

  # navigation
  go_router: ^14.6.2

  # networking
  dio: ^5.7.0

  # tokens live in the OS keychain / keystore, never SharedPreferences
  flutter_secure_storage: ^9.2.4

  # non-sensitive preferences (server url, last tab)
  shared_preferences: ^2.3.3

  intl: ^0.19.0

  # Native Plaid Link SDK (iOS/Android). The app never sees an
  # access_token -- Link returns a short-lived public_token which the
  # backend exchanges (docs/04).
  plaid_flutter: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
