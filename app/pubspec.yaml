name: nnf
description: "no-nonsense-finance — self-hosted budgeting"
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # state
  flutter_riverpod: ^2.6.1

  # navigation
  go_router: ^14.6.2

  # networking
  dio: ^5.7.0

  # receipts: camera and library, plus downscaling before upload — a
  # full-resolution phone photo is several MB and the model does not
  # need it.
  image_picker: ^1.1.2
  # tokens live in the OS keychain / keystore, never SharedPreferences
  flutter_secure_storage: ^9.2.4

  # non-sensitive preferences (server url, last tab)
  shared_preferences: ^2.3.3

  intl: ^0.19.0
  # Renders the assistant's answers. It emits markdown and the
  # screen used to show the asterisks literally.
  flutter_markdown_plus: ^1.0.3

  # Native Plaid Link SDK (iOS/Android). The app never sees an
  # access_token -- Link returns a short-lived public_token which the
  # backend exchanges (docs/04).
  plaid_flutter: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo/

# Regenerate the launcher icons after changing anything in assets/logo:
#     dart run flutter_launcher_icons
# The generated files under android/.../mipmap-* and ios/.../AppIcon are
# committed, so a clean checkout builds without running this first.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo/icon.png
  # Android 8+ masks the icon to whatever shape the launcher wants, and
  # only the central ~72% of the foreground layer survives it. The
  # artwork in icon_foreground.png is sized for that; the background is
  # the logo's own white so the mask reads as a clean white tile.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/logo/icon_foreground.png
  # Android 13 themed icons: the launcher recolours a monochrome layer
  # to match the wallpaper.
  android_monochrome: assets/logo/icon_foreground.png
  # iOS rejects an app icon with an alpha channel at submission time.
  remove_alpha_ios: true
