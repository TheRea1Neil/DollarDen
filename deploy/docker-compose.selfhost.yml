# A complete instance, standing on nothing that was already there.
#
# This is what somebody installing this runs. `docker compose up -d`
# in a directory with an .env next to it, and the API answers on
# ${DOLLARDEN_PORT}. No reverse proxy required, no pre-existing Docker
# network, no assumptions about the host.
#
# That last part is the whole point of a separate file. The original
# compose declares `networks: wg: external: true` -- a Caddy network
# that exists on exactly one Raspberry Pi -- so a fresh `docker compose
# up` fails before it starts anything. It works there and nowhere else,
# which is invisible until someone else tries it.
#
# HTTPS is deliberately not here. Certificates belong to a reverse
# proxy: Let's Encrypt needs either port 80 reachable or DNS API
# credentials, neither of which this container has, and binding 443
# inside it would fight whatever else is on the host. Run it plain on
# your own network, or put Caddy, nginx or a tunnel in front. See
# docs/17.
#
#   docker compose -f docker-compose.selfhost.yml -p dollarden up -d
#   docker compose -f docker-compose.selfhost.yml -p dollarden exec api \
#       alembic upgrade head

name: ${DOLLARDEN_PROJECT:-dollarden}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dollarden}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-dollarden}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dollarden} -d ${POSTGRES_DB:-dollarden}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published. Nothing outside this compose project has any
    # business reaching the database directly, and a Postgres on a
    # published port is how home servers end up in botnets.

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Set here rather than in .env: they describe this compose
      # project's own wiring, not a choice the operator makes.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    volumes:
      - receipts:/data/receipts
    ports:
      - "${DOLLARDEN_PORT:-21821}:8081"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8081/api/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  db:
  receipts:
