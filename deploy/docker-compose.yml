# no-nonsense-finance -- deploys alongside the existing wireguard stack on nando.
#
# Postgres is its OWN instance on host port 5433. 5432 is free now that the
# CasaOS Postgres is stopped, but 5433 keeps re-enabling that service safe.
#
#   cd deploy && docker compose --env-file ../.env up -d

name: nnf

services:
  nnf-postgres:
    image: postgres:16-alpine
    container_name: nnf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Deterministic collation so ORDER BY does not shift under a locale change.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      - nnf_pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      # Bound to localhost: reachable from the Pi and over the VPN, never the LAN.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [nnf]

  nnf-api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: nnf-api
    restart: unless-stopped
    depends_on:
      nnf-postgres:
        condition: service_healthy
    env_file: ../.env
    environment:
      POSTGRES_HOST: nnf-postgres
      POSTGRES_PORT: 5432
    volumes:
      - nnf_receipts:/data/receipts
    expose:
      - "8081"
    networks: [nnf, wg]   # wg = the existing Caddy network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8081/api/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  nnf_pgdata:
  nnf_receipts:

networks:
  nnf:
    name: nnf
  # Join the existing Caddy network so the TLS edge can reach the API.
  wg:
    external: true
